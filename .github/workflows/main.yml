name: main

# Release flow: dispatch with the Metanorma product version (e.g. 1.17.0).
# build.ps1 locates the newest packed-metanorma release carrying the
# matching signed MSI, renders the nuspec + install script, and packs the
# wrapper nupkg. The test job installs it from the local source, polls
# `metanorma --version` until the seeded runtime answers, then uninstalls.
# Only a green test unlocks the publish job, gated by the
# `chocolatey-publish` environment.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Metanorma product version (e.g. 1.17.0) — the newest packed-metanorma release carrying metanorma-setup-<version>-windows-ucrt64.msi is wrapped'
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the wrapper package
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build.ps1 -Version '${{ inputs.version }}'

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: metanorma.*.nupkg

  test:
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg

      - name: Install metanorma from the local package
        shell: pwsh
        run: |
          choco install metanorma --source "$((Get-Location).Path)" -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install failed with exit code $LASTEXITCODE" }

      # The MSI seeds the runtime at install time, but the first shim
      # dispatch may still need minutes (runtime fetch/warm); poll rather
      # than assert once. Update-SessionEnvironment picks up the machine
      # PATH the MSI just wired.
      - name: Verify metanorma answers on PATH
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddMinutes(15)
          $ready = $false
          while ((Get-Date) -lt $deadline) {
            Update-SessionEnvironment
            if (Get-Command metanorma -ErrorAction SilentlyContinue) {
              $out = & metanorma --version 2>&1 | Out-String
              Write-Host "metanorma --version: $out"
              if ($LASTEXITCODE -eq 0 -and $out -match 'Metanorma::Cli') {
                $ready = $true
                break
              }
            } else {
              Write-Host 'metanorma not on PATH yet'
            }
            Start-Sleep -Seconds 20
          }
          if (-not $ready) {
            throw 'metanorma --version did not report Metanorma::Cli within 15 minutes'
          }

      - name: Uninstall metanorma and assert removal
        shell: pwsh
        run: |
          choco uninstall metanorma -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco uninstall failed with exit code $LASTEXITCODE" }
          Update-SessionEnvironment
          if (Get-Command metanorma -ErrorAction SilentlyContinue) {
            throw 'metanorma is still on PATH after uninstall'
          }
          Write-Host 'metanorma removed cleanly'

  publish:
    runs-on: windows-latest
    needs: test
    environment: chocolatey-publish
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg

      - name: Push to chocolatey.org
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          $nupkg = Get-ChildItem *.nupkg | Select-Object -First 1
          choco apikey --key $env:CHOCOLATEY_API_KEY --source https://push.chocolatey.org/
          choco push $nupkg.Name --source https://push.chocolatey.org/

name: main

# Release flow: dispatch with the Metanorma product version (e.g. 1.17.0).
# build.ps1 locates the newest packed-metanorma release carrying the
# matching signed MSI, renders the nuspec + install script, and packs the
# wrapper nupkg. The test job installs it from the local source, polls
# `metanorma --version` until the seeded runtime answers, then uninstalls.
# Only a green test unlocks the publish job, gated by the
# `chocolatey-publish` environment.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Metanorma product version (e.g. 1.17.0) — the newest packed-metanorma release carrying metanorma-setup-<version>-windows-ucrt64.msi is wrapped'
        required: true
        type: string
  repository_dispatch:
    # Release fan-out from metanorma/packed-metanorma tag builds; the
    # payload carries client_payload.version (the plain product version).
    types: [ metanorma/packed-metanorma ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the target version
        shell: pwsh
        run: |
          $v = '${{ inputs.version }}'
          if (-not $v) { $v = '${{ github.event.client_payload.version }}' }
          if (-not $v) { throw 'no version: dispatch needs inputs.version or client_payload.version' }
          "TARGET_VERSION=$v" | Out-File $env:GITHUB_ENV -Append

      - name: Build the wrapper package
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build.ps1 -Version "$env:TARGET_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: metanorma.*.nupkg

  test:
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg

      - name: Install metanorma from the local package
        shell: pwsh
        run: |
          choco install metanorma --source "$((Get-Location).Path)" -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install failed with exit code $LASTEXITCODE" }

      # The MSI seeds the runtime at install time, but the first shim
      # dispatch may still need minutes (runtime fetch/warm); poll rather
      # than assert once. Refresh PATH from the registry each round to pick
      # up the machine PATH the MSI just wired (Update-SessionEnvironment
      # needs a chocolatey helper module pwsh 7 does not ship).
      - name: Verify metanorma answers on PATH
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddMinutes(15)
          $ready = $false
          while ((Get-Date) -lt $deadline) {
            $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User')
            if (Get-Command metanorma -ErrorAction SilentlyContinue) {
              $out = & metanorma --version 2>&1 | Out-String
              Write-Host "metanorma --version: $out"
              if ($LASTEXITCODE -eq 0 -and $out -match 'Metanorma::Cli') {
                $ready = $true
                break
              }
            } else {
              Write-Host 'metanorma not on PATH yet'
            }
            Start-Sleep -Seconds 20
          }
          if (-not $ready) {
            throw 'metanorma --version did not report Metanorma::Cli within 15 minutes'
          }

      - name: Uninstall metanorma and assert removal
        shell: pwsh
        run: |
          choco uninstall metanorma -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco uninstall failed with exit code $LASTEXITCODE" }
          $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User')
          if (Get-Command metanorma -ErrorAction SilentlyContinue) {
            throw 'metanorma is still on PATH after uninstall'
          }
          Write-Host 'metanorma removed cleanly'

  publish:
    runs-on: windows-latest
    needs: test
    environment: chocolatey-publish
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg

      - name: Skip when chocolatey.org already has this version
        id: dupcheck
        shell: pwsh
        run: |
          # Respin tags re-fire the release fan-out; chocolatey.org rejects
          # a duplicate version push with a hard error. The Packages feed
          # lists versions still in moderation too, so a just-pushed
          # version is found here.
          $nupkg = Get-ChildItem *.nupkg | Select-Object -First 1
          if ($nupkg.Name -match '^metanorma\.(.+)\.nupkg$') { $v = $Matches[1] } else { throw "cannot parse the version from $($nupkg.Name)" }
          $found = $false
          try {
            Invoke-RestMethod "https://community.chocolatey.org/api/v2/Packages(Id='metanorma',Version='$v')" | Out-Null
            $found = $true
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
          }
          if ($found) {
            Write-Host "chocolatey.org already has metanorma $v (published or in moderation) — skipping the push"
            "skip=true" | Out-File $env:GITHUB_OUTPUT -Append
          } else {
            "skip=false" | Out-File $env:GITHUB_OUTPUT -Append
          }

      - if: steps.dupcheck.outputs.skip == 'false'
        name: Push to chocolatey.org
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          $nupkg = Get-ChildItem *.nupkg | Select-Object -First 1
          choco apikey --key $env:CHOCOLATEY_API_KEY --source https://push.chocolatey.org/
          choco push $nupkg.Name --source https://push.chocolatey.org/
